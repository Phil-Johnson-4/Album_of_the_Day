<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album of the Day</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1" id="glow1"></div>
  <div class="ambient-glow glow-2" id="glow2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="vinyl-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
          </svg>
        </span>
        <h1 id="appTitle">ALBUM OF THE DAY</h1>
      </div>
      <p class="subtitle" id="dateRangeSubtitle">Curated Weekday Music Rotation</p>
    </header>

    <!-- Main Today's Album Showcase -->
    <main class="showcase">
      <div class="single-album-container" id="singleAlbumContainer">
        <!-- Today's Featured Album Card generated by app.js -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Fetching album of the day...</p>
        </div>
      </div>
    </main>

    <!-- Upcoming Day Text Preview -->
    <section class="upcoming-preview-container">
      <div class="upcoming-badge">
        <span class="pulse-dot"></span>
        <span id="upcomingLabel">SNEAK PEEK</span>
      </div>
      <div class="upcoming-text-content" id="upcomingTextContent">
        <span class="preview-day" id="upcomingDayName">Upcoming Day:</span>
        <span class="preview-album" id="upcomingAlbumTitle">--</span>
        <span class="preview-divider">by</span>
        <span class="preview-artist" id="upcomingArtistName">--</span>
      </div>
    </section>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
